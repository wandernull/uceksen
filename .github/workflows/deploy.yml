name: deploy

# Branch `staging` → staging Worker (wrangler.toml top level, staging.uceksen.com).
# Branch `main`    → production Worker ([env.production], uceksen.com).
# `main` only receives merges from `staging`, with the user's green light.
on:
  push:
    branches: [staging, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Empty for staging (top level), "--env production" for main.
      WRANGLER_ENV: ${{ github.ref_name == 'main' && '--env production' || '' }}
    steps:
      - name: Only staging and main deploy
        if: github.ref_name != 'staging' && github.ref_name != 'main'
        run: exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:design
      - run: npm run typecheck
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote $WRANGLER_ENV
      - name: Deploy
        run: npx wrangler deploy $WRANGLER_ENV
