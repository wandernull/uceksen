name = "uceksen"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
account_id = "ef35eded2f130806ec2824e2920866ee"
workers_dev = true

# Static pages from public/. Matching files are served directly; everything else
# (APIs, dynamic pages) falls through to the Worker. /rehber serves rehber.html,
# /rehber.html redirects to /rehber.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Single deployment. ENVIRONMENT stays "staging" until go-live (Phase 9) so the
# DEV_EMAIL guard is active. Locally, .dev.vars overrides it to "local".
[vars]
ENVIRONMENT = "staging"
APP_URL = "https://uceksen.gizemderinkok.workers.dev"
# Cloudflare Access (Zero Trust) for /admin. Empty = /admin refuses everyone on
# the deployed Worker. Filled in once the Access application exists.
ACCESS_TEAM_DOMAIN = "twilight-surf-1e57.cloudflareaccess.com"
ACCESS_AUD = "3cd68cb34b43442be78fbe69bbd46d5292f1e697a9a0cd94879bf00636db5d0b"
# Email (Resend). Replies come back to REPLY_LOCAL+<plus_token>@REPLY_DOMAIN, a
# receiving-only Resend domain; the root domain's MX belongs to Cloudflare Email Routing.
MAIL_FROM = "Üç Eksen <merhaba@uceksen.com>"
MAIL_DOMAIN = "uceksen.com"
REPLY_LOCAL = "merhaba"
REPLY_DOMAIN = "reply.uceksen.com"
# Stripe prices (sandbox ids during the build; replaced with live ids at go-live).
STRIPE_PRICE_GUIDE = "price_1UZUGsJguQXFmVyOe5dbLWcY"
STRIPE_PRICE_CONSULT = "price_1UZUGtJguQXFmVyOrMb6Nq3j"
# Secrets (wrangler secret put): ADMIN_EMAILS ("gizem=a@x.com,baran=b@y.com"),
# DEV_EMAIL, RESEND_API_KEY, RESEND_INBOUND_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ENCRYPTION_KEY (base64, 32 bytes)

[[d1_databases]]
binding = "DB"
database_name = "uceksen-db"
database_id = "8cef0ac7-f979-4657-822f-ee79f0cb5bac"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "f05d599c3a54463db998dc1cd52de224"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "uceksen-files"

[observability]
enabled = true
